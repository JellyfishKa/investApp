version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: invest_mrsu_db
    environment:
      POSTGRES_DB: invest_mrsu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: invest_mrsu_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/invest_mrsu
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
